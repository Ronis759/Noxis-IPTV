name: Build APK
permissions:
  contents: write
on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE", ".github/dependabot.yml"]   # правки только документации релиз не создают
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз (его увидит автообновление в приложении)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # релиз при push создаётся только если задан постоянный ключ: иначе APK не сможет обновить установленный
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4   # gradle-wrapper.jar должен совпадать с официальным
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи из Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 не задан: APK подписан временным ключом, обновление поверх установленного не встанет"
          fi
      - name: Юнит-тесты
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Контрольная сумма APK
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-tv-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
      - name: Версия из build.gradle.kts
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Публикация релиза
        if: (github.event_name == 'push' && env.HAS_KEY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          # тег = номер запуска (по нему сравнивает автообновление), в названии — читаемая версия
          tag_name: v${{ github.run_number }}
          name: ${{ steps.ver.outputs.name }} (сборка ${{ github.run_number }})
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          make_latest: true
